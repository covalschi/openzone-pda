# Переносна половина профілю для dayz-agentic-modding-mcp.
# Машинні шляхи живуть у dayz-mcp.local.toml, який не комітиться.
#
# КПК ЖОРСТКО залежить від @OpenZone_Core через requiredAddons. Без нього гра
# показує блокуюче вікно «Addon requires addon» ще до завантаження — це не
# тихий пропуск pbo. Тому ядро підставляється стенду через [mods] extra
# у локальному файлі, а не через цей.

[project]
name = "openzone-pda"

[build]
# КПК плюс необов'язкова вкладка «PDA» для адмінського вікна VPP -- окремим
# pbo: у вкладки жорстка залежність від VPP і від вкладки ядра.
mods = ["OpenZone_PDA", "OpenZone_PDA_VPP"]

[expect]
ready_line   = "pda loaded"
max_warnings = 0
forbid       = ["Bad type", "Can't compile", "NULL pointer to instance"]
# OZ_ і OZR_ окремо: "OZR_" НЕ містить "OZ_", тож один шаблон не ловить обидва,
# і помилка КПК під час прогону рації (чи навпаки) лишалась би невидимою.
# Третій шаблон ловить помилки, які друкує САМ МОД (OZ_Log.Error): вони
# виходять звичайним `SCRIPT :` із префіксом `[OpenZone] ERROR:` і під
# `SCRIPT\s+\(E\)` не підпадають. Без нього вердикт не бачив їх ЖОДНОГО разу
# -- зіпсований конфіг гравця давав `pass` із нулем помилок (2026-09-01).
error_regex  = ["SCRIPT\\s+\\(E\\).*OZ_", "SCRIPT\\s+\\(E\\).*OZR_", "\\[OpenZone\\] ERROR"]
# Стенд ходить до моста по http на 127.0.0.1, і ядро чесно попереджає про це
# кожен бут. На локальному стенді це стан, а не подія: без цього рядка
# max_warnings = 0 робить вердикт вічно червоним і ховає справжні попередження.
# У проді Bridge.Url мусить бути https -- тоді попередження зникне саме.
noise        = [
    "Bridge.Url is not https",
    # Профілі КПК везуть сторінку "faction", а реєструє її склейка
    # OpenZone_Factions_PDA, якої на ЦЬОМУ стенді немає навмисно: стенд
    # проєкту вантажить лише свою частину, спільний прогін іде з рації.
    # Тобто це стан набору модів, а не подія. Шаблон НАВМИСНО названий
    # сторінкою поіменно: друкарська помилка в будь-якій іншій назві
    # сторінки має й далі робити вердикт червоним.
    "page \"faction\" is not registered",
]

# Числа -- ДЛЯ ЦЬОГО НАБОРУ МОДІВ, а не для стенду взагалі. Вони ростуть,
# коли чужий мод реєструє свою сторінку чи свій модуль, і це не помилка, а
# договір, що працює.
#
# modules = 4, а не 5: рація більше не живе в КПК. Радіомодуль переїхав у
# OpenZone_Radio_PDA 2026-08-31, і оголошує його тепер той мод, якого в
# [mods] extra тут немає. Шпигунська антена в цьому числі не рахується
# ніколи -- вона окремий предмет із власною поведінкою, а не запис у
# Hardware.json.
[expect.counters]
profiles = 3
# pages = 7, а не 9. Реєстр рахує РЕАЛЬНО зареєстровані сторінки, а їх
# приносять склейки: "faction" -- OpenZone_Factions_PDA, "radio" --
# OpenZone_Radio_PDA. Жодної з них у [mods] extra тут немає, і це не
# недогляд: стенд проєкту вантажить лише свою частину. Дев'ятка лишалася
# від стенду, який вантажив усе, і робила вердикт вічно червоним.
pages    = 7
modules  = 4
# factions тут НЕ оголошується. Це лічильник із рядка готовності ЯДРА, а
# цей профіль читає рядок КПК ("pda loaded"), де такого числа немає взагалі
# -- очікування, яке не може справдитись ніколи.
carriers = 3

[client]
# The client runs with -filePatching and mod_build keeps @<Mod>/<Mod> as a junction
# to the source tree, so an edited .layout is read without repacking (the stand
# config already carries allowFilePatching = 1).
file_patching = true
